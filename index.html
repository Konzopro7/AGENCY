<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f8fb" />

    <title>KonzoTech Agency | Sites Web performants et SEO à Montréal</title>
    <meta
      name="description"
      content="Agence Web à Montréal spécialisée en sites vitrines, commerce électronique, applications Web, SEO, performance et conversion."
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://konzotechagency.com/" />

    <meta property="og:site_name" content="KonzoTech Agency" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://konzotechagency.com/" />
    <meta property="og:locale" content="fr_CA" />
    <meta property="og:title" content="KonzoTech Agency | Sites Web performants et SEO à Montréal" />
    <meta
      property="og:description"
      content="Sites vitrines, e-commerce et applications web qui convertissent. Design premium, performance et SEO."
    />
    <meta property="og:image" content="https://konzotechagency.com/og.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KonzoTech Agency" />

      name="twitter:description"
      content="Sites web modernes, rapides et rentables. Design premium, performance et SEO."
    />
    <meta name="twitter:image" content="https://konzotechagency.com/og.svg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "KonzoTech Agency",
        "url": "https://konzotechagency.com/",
        "inLanguage": ["fr-CA", "en-CA"]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      (() => {
        try {
          const stored = localStorage.getItem("kt-theme");
          const theme = stored || "light";
          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
