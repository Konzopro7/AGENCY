; Application-level defense in depth for the PHP endpoints.
; The hosting provider must still run a PHP build patched for CVE-2026-109618
; and CVE-2026-109619; per-directory settings are not a runtime substitute.
display_errors=Off
expose_php=Off
allow_url_include=Off
file_uploads=Off
session.upload_progress.enabled=Off
post_max_size=128K
upload_max_filesize=128K
max_input_vars=50
max_input_nesting_level=16
