name: Deploy to Hosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          VITE_CONTACT_ENDPOINT: ${{ secrets.VITE_CONTACT_ENDPOINT || vars.VITE_CONTACT_ENDPOINT }}
          VITE_NEWSLETTER_ENDPOINT: ${{ secrets.VITE_NEWSLETTER_ENDPOINT || vars.VITE_NEWSLETTER_ENDPOINT }}
          VITE_GA4_MEASUREMENT_ID: ${{ secrets.VITE_GA4_MEASUREMENT_ID || vars.VITE_GA4_MEASUREMENT_ID }}
          VITE_ADMIN_DASHBOARD_TOKEN: ${{ secrets.VITE_ADMIN_DASHBOARD_TOKEN || vars.VITE_ADMIN_DASHBOARD_TOKEN }}
        run: npm run build

      - name: Validate FTP configuration
        env:
          FTP_HOST_VALUE: ${{ secrets.FTP_HOST || secrets.FTP_SERVER || vars.FTP_HOST || vars.FTP_SERVER }}
          FTP_USER_VALUE: ${{ secrets.FTP_USER || secrets.FTP_USERNAME || vars.FTP_USER || vars.FTP_USERNAME }}
          FTP_PASSWORD_VALUE: ${{ secrets.FTP_PASSWORD || secrets.FTP_PASS || vars.FTP_PASSWORD || vars.FTP_PASS }}
          FTP_PROTOCOL_VALUE: ${{ secrets.FTP_PROTOCOL || vars.FTP_PROTOCOL || 'ftp' }}
          FTP_PORT_VALUE: ${{ secrets.FTP_PORT || vars.FTP_PORT || 21 }}
          FTP_SERVER_DIR_VALUE: ${{ secrets.FTP_SERVER_DIR || vars.FTP_SERVER_DIR || '/public_html/' }}
        run: |
          if [ -z "$FTP_HOST_VALUE" ]; then
            echo "Missing FTP host. Set FTP_HOST (or FTP_SERVER)."
            exit 1
          fi
          if [ -z "$FTP_USER_VALUE" ]; then
            echo "Missing FTP user. Set FTP_USER (or FTP_USERNAME)."
            exit 1
          fi
          if [ -z "$FTP_PASSWORD_VALUE" ]; then
            echo "Missing FTP password. Set FTP_PASSWORD (or FTP_PASS)."
            exit 1
          fi
          echo "FTP config detected. protocol=$FTP_PROTOCOL_VALUE port=$FTP_PORT_VALUE server_dir=$FTP_SERVER_DIR_VALUE"

      - name: Resolve FTP server directory variants
        id: ftp_dir
        shell: bash
        env:
          FTP_SERVER_DIR_RAW: ${{ secrets.FTP_SERVER_DIR || vars.FTP_SERVER_DIR || '/public_html/' }}
        run: |
          primary="$(echo "$FTP_SERVER_DIR_RAW" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$primary" ]; then
            primary="/public_html/"
          fi

          case "$primary" in
            */) ;;
            *) primary="${primary}/" ;;
          esac

          if [ "${primary#/}" != "$primary" ]; then
            alt="${primary#/}"
          else
            alt="/${primary}"
          fi

          has_alt="true"
          if [ "$alt" = "$primary" ]; then
            has_alt="false"
          fi

          echo "primary=$primary" >> "$GITHUB_OUTPUT"
          echo "alt=$alt" >> "$GITHUB_OUTPUT"
          echo "has_alt=$has_alt" >> "$GITHUB_OUTPUT"

          echo "Resolved server-dir primary=$primary"
          if [ "$has_alt" = "true" ]; then
            echo "Resolved server-dir alt=$alt"
          fi

      - name: Deploy (FTP primary dir)
        id: deploy_ftp_primary
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST || secrets.FTP_SERVER || vars.FTP_HOST || vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USER || secrets.FTP_USERNAME || vars.FTP_USER || vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || secrets.FTP_PASS || vars.FTP_PASSWORD || vars.FTP_PASS }}
          protocol: ${{ secrets.FTP_PROTOCOL || vars.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || vars.FTP_PORT || 21 }}
          local-dir: ./dist/
          server-dir: ${{ steps.ftp_dir.outputs.primary }}
          dangerous-clean-slate: false

      - name: Deploy (FTP alt dir fallback)
        id: deploy_ftp_alt
        if: steps.deploy_ftp_primary.outcome == 'failure' && steps.ftp_dir.outputs.has_alt == 'true'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST || secrets.FTP_SERVER || vars.FTP_HOST || vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USER || secrets.FTP_USERNAME || vars.FTP_USER || vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || secrets.FTP_PASS || vars.FTP_PASSWORD || vars.FTP_PASS }}
          protocol: ${{ secrets.FTP_PROTOCOL || vars.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || vars.FTP_PORT || 21 }}
          local-dir: ./dist/
          server-dir: ${{ steps.ftp_dir.outputs.alt }}
          dangerous-clean-slate: false

      - name: Deploy (FTPS primary dir fallback)
        id: deploy_ftps_primary
        if: steps.deploy_ftp_primary.outcome == 'failure' && (steps.deploy_ftp_alt.outcome == 'failure' || steps.deploy_ftp_alt.outcome == 'skipped')
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST || secrets.FTP_SERVER || vars.FTP_HOST || vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USER || secrets.FTP_USERNAME || vars.FTP_USER || vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || secrets.FTP_PASS || vars.FTP_PASSWORD || vars.FTP_PASS }}
          protocol: ftps
          port: ${{ secrets.FTP_PORT || vars.FTP_PORT || 21 }}
          local-dir: ./dist/
          server-dir: ${{ steps.ftp_dir.outputs.primary }}
          dangerous-clean-slate: false

      - name: Deploy (FTPS alt dir fallback)
        id: deploy_ftps_alt
        if: steps.deploy_ftps_primary.outcome == 'failure' && steps.ftp_dir.outputs.has_alt == 'true'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST || secrets.FTP_SERVER || vars.FTP_HOST || vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USER || secrets.FTP_USERNAME || vars.FTP_USER || vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || secrets.FTP_PASS || vars.FTP_PASSWORD || vars.FTP_PASS }}
          protocol: ftps
          port: ${{ secrets.FTP_PORT || vars.FTP_PORT || 21 }}
          local-dir: ./dist/
          server-dir: ${{ steps.ftp_dir.outputs.alt }}
          dangerous-clean-slate: false

      - name: Fail if all deploy attempts failed
        if: steps.deploy_ftp_primary.outcome == 'failure' && (steps.deploy_ftp_alt.outcome == 'failure' || steps.deploy_ftp_alt.outcome == 'skipped') && steps.deploy_ftps_primary.outcome == 'failure' && (steps.deploy_ftps_alt.outcome == 'failure' || steps.deploy_ftps_alt.outcome == 'skipped')
        run: |
          echo "All deploy attempts failed (FTP/FTPS with primary/alt directories). Check FTP host/user/password and server directory."
          exit 1
